[project]
name = "bank-data-governance-agent"
version = "0.1.0"
description = "MVP educativo de gobierno de datos bancarios sinteticos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-postgres>=0.0.16,<1",
    "langgraph>=1,<2",
    "langsmith>=0.3,<1",
    "ollama>=0.6,<1",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
cloud = ["langchain-google-genai>=4,<5"]

[project.scripts]
bank-steward = "bank_governance.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bank_governance", "scripts"]

# El repositorio define su propia raiz, independiente de la carpeta superior.
[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requiere PostgreSQL local; crea datos de prueba en una transaccion que siempre se revierte",
    "retrieval: requiere Ollama y el corpus previamente indexado; solo realiza consultas",
    "agent: requiere llama3.1, Ollama y el corpus existente; no modifica datos ni documentos",
]
