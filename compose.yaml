name: bank-data-governance-agent-dev

services:
  bank-postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copia .env.example a .env y configura POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bank-postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/postgres/init/001-enable-vector.sql
        target: /docker-entrypoint-initdb.d/001-enable-vector.sql
        read_only: true
        bind:
          create_host_path: false
    networks:
      - bank-postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  bank-postgres-data:

networks:
  bank-postgres-network:
